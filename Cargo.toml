[package]
name = "appscreener_pattern_sync"
version = "0.2.0"
edition = "2024"
description = "Synchronize local XML patterns with an existing Solar appScreener custom rule"

[dependencies]
anyhow = "1.0.104"

clap = { version = "4.6.6", features = ["derive", "env"] }

quick-xml = "0.41.0"

reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }

serde = { version = "1.0.229", features = ["derive"] }

serde_json = "1.0.151"

serde-saphyr = { version = "1.0.1", default-features = false, features = ["deserialize"] }

sha2 = "0.11.0"
thiserror = "2.0.19"

tracing = "0.1.44"

tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

uuid = { version = "1.24.0", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
